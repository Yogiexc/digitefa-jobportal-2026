version: '3.3'

services:
  backend:
    build:
      context: ./job-portal-server-side
      dockerfile: Dockerfile.backend
    container_name: job_portal_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Use the container names for inter-service communication
      - URL_SERVER_PYTHON=http://ai_http_server:9090
      - SOCKET_SERVER_PYTHON=tcp://python_server:5555
      - DATABASE_URL=mysql://root:root@db:3306/digitefa_job_portal
    env_file:
      - ./job-portal-server-side/.env.development
    volumes:
      - ./job-portal-server-side/public:/usr/src/app/public
    networks:
      - app_network
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: job_portal_db
    restart: unless-stopped
    command: [
      "--performance_schema=OFF",
      "--key_buffer_size=16M",
      "--tmp_table_size=1M",
      "--max_connections=10",
      "--innodb_buffer_pool_size=16M",
      "--innodb_log_buffer_size=1M",
      "--query_cache_size=0",
      "--max_heap_table_size=1M"
    ]
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=digitefa_job_portal
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - app_network


  ai_http_server:
    build:
      context: ./digitefa-python
      dockerfile: Dockerfile
    container_name: job_portal_ai_http_server
    restart: unless-stopped
    volumes:
      - ./digitefa-python:/app
    ports:
      - "9090:9090"
    environment:
      - MPLBACKEND=Agg
      - HF_HUB_DISABLE_TELEMETRY=1
      - HF_HUB_ENABLE_HF_TRANSFER=0
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
