version: '3.7'
services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: client-side
    container_name: lms-fe-container
    restart: unless-stopped
    ports:
      - 8800:80
    environment:
      - VUE_APP_API_URL=https://api-lms.digitefa.id/api
      - VUE_APP_STUDENT_PROFILE_URL="https://api-lms.digitefa.id/uploads/Student/Student Profile"
      - VUE_APP_TEACHER_PROFILE_URL="https://api-lms.digitefa.id/uploads/Teacher/Profile Picture"
      - VUE_APP_COURSE_THUMBNAIL_URL=http://api-lms.digitefa.id/uploads/Courses/Thumbnail
      - VUE_APP_TEACHER_ABOUT_URL=http://api-lms.digitefa.id/uploads
      - VUE_APP_TEACHER_MEDIA_PARTNER_URL=http://api-lms.digitefa.id/uploads/media_partner
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - client-side

  nginx:
    image: nginx:alpine
    container_name: lms-fe-nginx
    restart: unless-stopped
    ports:
      - 3300:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - client-side

networks:
  client-side:
    driver: bridge
