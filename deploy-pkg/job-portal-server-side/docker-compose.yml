version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
    env_file:
      - .env.staging
    volumes:
      - ./public:/usr/src/app/public
    networks:
      - app_network
  
  python_server:
    build:
      context: ./python
      dockerfile: Dockerfile.python
    container_name: python_server
    restart: unless-stopped
    ports:
      - "5555:5555"
    networks:
      - app_network

networks:
  app_network:
    name: app_network